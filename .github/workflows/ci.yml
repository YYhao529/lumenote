name: CI

on:
  push:
    branches: [ master, main, 'rename/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile all modules
        run: mvn -B -DskipTests compile

      - name: Framework unit tests
        run: mvn -B -pl lumenote-framework/lumenote-common,lumenote-framework/lumenote-common-mq,lumenote-framework/lumenote-spring-boot-starter-biz-context,lumenote-framework/lumenote-spring-boot-starter-jackson,lumenote-framework/lumenote-spring-boot-starter-biz-operationlog -am test
