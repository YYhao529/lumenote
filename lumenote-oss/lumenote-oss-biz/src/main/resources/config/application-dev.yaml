#=================================================================
# 对象存储配置
#=================================================================
storage:
  minio:
    endpoint: http://192.168.100.111:9000 # 虚拟机 Docker 里的 MinIO
    accessKey: ${MINIO_ACCESS_KEY:deepsea}
    secretKey: ${MINIO_SECRET_KEY:12345678} # MinIO 要求密码至少 8 位
  aliyun-oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    # 阿里云 AK/SK 从操作系统环境变量读取，不写进仓库
    # Windows: setx OSS_ACCESS_KEY_ID "你的Key"（重新打开终端生效）
    # macOS/Linux: export OSS_ACCESS_KEY_ID="你的Key"
    # 本地开发用 MinIO，不碰阿里云；但 OSSClient 在 AK 为空时会直接抛
    # InvalidCredentialsException 导致服务启动失败，所以这里给占位默认值。
    accessKey: "${OSS_ACCESS_KEY_ID:dev-only-placeholder}"
    secretKey: "${OSS_ACCESS_KEY_SECRET:dev-only-placeholder}"