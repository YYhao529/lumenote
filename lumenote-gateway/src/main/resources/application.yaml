server:
  port: 8000 # 指定启动端口
spring:
  codec:
    # 上传头像/背景图/视频的 multipart 请求经过网关时的缓冲上限
    max-in-memory-size: 210MB
  cloud:
    gateway:
      # 开发环境前端（5180）与网关（8000）不同源，统一在这里放开 CORS
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://127.0.0.1:5180"
              - "http://localhost:5180"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth
          uri: lb://lumenote-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        # 注意：user / note / relation / search / count / file 的控制器自带类级前缀
        # （@RequestMapping("/user")、"/note"、"/relation"、"/search"、"/count"、"/file"），
        # 所以这里不能再 StripPrefix，否则 /user/findByPhone 会被转发成 /findByPhone 而 404。
        # 只有 auth 服务的控制器没有类级前缀（/login、/logout），才需要 StripPrefix=1。
        - id: user
          uri: lb://lumenote-user
          predicates:
            - Path=/user/**
        - id: note
          uri: lb://lumenote-note
          predicates:
            - Path=/note/**
        - id: user-relation
          uri: lb://lumenote-user-relation
          predicates:
            - Path=/relation/**
        - id: search
          uri: lb://lumenote-search
          predicates:
            - Path=/search/**
        - id: count
          uri: lb://lumenote-count
          predicates:
            - Path=/count/**
        - id: oss
          uri: lb://lumenote-oss
          predicates:
            - Path=/file/**
        # 智能助手：控制器自带 @RequestMapping("/aigc")，所以不加 StripPrefix
        - id: aigc
          uri: lb://lumenote-aigc
          predicates:
            - Path=/aigc/**
  data:
    redis:
      database: 0 # Redis 数据库索引（默认为 0）
      host: 192.168.100.111 # Redis 服务器地址（虚拟机 Docker）
      port: 6379 # Redis 服务器连接端口
      password: ${REDIS_PASSWORD:} # Redis 服务器连接密码（生产环境通过环境变量设置）
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 链接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 前缀
  token-prefix: Bearer
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-128
  # 是否输出操作日志
  is-log: true