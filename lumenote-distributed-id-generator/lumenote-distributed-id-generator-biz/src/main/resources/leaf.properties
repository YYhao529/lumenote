leaf.name=com.sankuai.leaf.opensource.test
leaf.segment.enable=true
leaf.jdbc.url=jdbc:mysql://192.168.100.111:3306/leaf?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
leaf.jdbc.username=root
leaf.jdbc.password=1234

leaf.snowflake.enable=true
# Leaf 雪花模式靠 ZooKeeper 分配 workerId，znode 路径 = /snowflake/{leaf.name}
leaf.snowflake.zk.address=192.168.100.111:2181
# 必须等于本模块的 server.port（application.yaml 里是 8085），
# Leaf 会用这个端口去探测已注册的 workerId 是否还活着，填错会导致 workerId 复用判断异常
leaf.snowflake.port=8085
