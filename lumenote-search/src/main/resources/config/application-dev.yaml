elasticsearch:
  address: 192.168.100.111:9200 # Elasticsearch 地址（虚拟机 Docker）

canal:  # Canal 配置
  address: 127.0.0.1:11111 # Canal 地址
  destination: example # Canal 目标库
  username: canal # Canal 用户名
  password: ${CANAL_PASSWORD:canal} # Canal 密码
  subscribe: lumenote.t_note,lumenote.t_user,lumenote.t_note_count,lumenote.t_user_count # 订阅笔记表、用户表、笔记计数表、用户计数表
  batchSize: 1000 # 一批次拉取数据量

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # 指定数据库驱动类
    # 数据库连接信息
    url: jdbc:mysql://192.168.100.111:3306/lumenote?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root} # 数据库用户名
    password: ${DB_PASSWORD:1234} # 本地 dev 默认 1234（虚拟机 Docker 里的 MySQL），生产用环境变量覆盖
    type: com.alibaba.druid.pool.DruidDataSource
    druid: # Druid 连接池
      initial-size: 5 # 初始化连接池大小
      min-idle: 5 # 最小连接池数量
      max-active: 20 # 最大连接池数量
      max-wait: 60000 # 连接时最大等待时间（单位：毫秒）
      test-while-idle: true
      time-between-eviction-runs-millis: 60000 # 配置多久进行一次检测，检测需要关闭的连接（单位：毫秒）
      min-evictable-idle-time-millis: 300000 # 配置一个连接在连接池中最小生存的时间（单位：毫秒）
      max-evictable-idle-time-millis: 900000 # 配置一个连接在连接池中最大生存的时间（单位：毫秒）
      validation-query: SELECT 1 FROM DUAL # 配置测试连接是否可用的查询 sql
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /druid/* # 配置监控后台访问路径
        login-username: ${DRUID_USERNAME:admin} # 配置监控后台登录的用户名
        login-password: ${DRUID_PASSWORD:}
      filter:
        config:
          enabled: true
        stat:
          enabled: true
          log-slow-sql: true # 开启慢 sql 记录
          slow-sql-millis: 2000 # 若执行耗时大于 2s，则视为慢 sql
          merge-sql: true
        wall: # 防火墙
          config:
            multi-statement-allow: true
