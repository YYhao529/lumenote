# 开发环境 Redis 配置（容器内 /usr/local/etc/redis/redis.conf）
# 说明：官方镜像若不带配置文件启动，protected-mode 在"无密码且未显式 bind"时会拒绝外部连接。
# 这里显式 bind 0.0.0.0 并关掉 protected-mode，保证 Windows 侧的 IDEA 能连上。

# RedisBloom：点赞/收藏的布隆过滤（BF.ADD / BF.EXISTS）依赖这个模块。
# .so 由 RedisBloom 2.2.18 源码在宿主机（CentOS 7 / glibc）编译，
# 所以 redis 镜像必须用 Debian 版（glibc），不能用 alpine（musl）。
# 挂载关系：宿主机 /opt/lumenote/redis/modules -> 容器 /opt/redis/modules
loadmodule /opt/redis/modules/redisbloom.so

bind 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# 持久化：AOF 每秒刷盘 + RDB 快照兜底，数据落在 /data（宿主机绑定挂载）
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000

databases 16
maxmemory-policy noeviction

# 需要密码时取消下面一行注释，并给项目配置 REDIS_PASSWORD 环境变量
# requirepass changeMe
