# Canal 实例配置：订阅宿主机 mysql8 上 lumenote 库的 binlog
# 从库标识，集群内要唯一
canal.instance.mysql.slaveId=1234

# 宿主机上的 MySQL（容器回连宿主机，见 docker-compose 的 extra_hosts）
canal.instance.master.address=host.docker.internal:3306
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=

# 账号由 start-extras.sh 创建并授予 REPLICATION SLAVE / REPLICATION CLIENT / SELECT
canal.instance.dbUsername=canal
canal.instance.dbPassword=canal
canal.instance.connectionCharset = UTF-8
canal.instance.enableDruid = false

# 订阅 lumenote 库下所有表（项目实际只关心 t_note / t_user / t_note_count / t_user_count）
canal.instance.filter.regex=lumenote\\..*
canal.instance.filter.black.regex=

# 开发环境关掉 tsdb（省一次 H2 初始化，排在排查之外）
canal.instance.tsdb.enable = false

canal.instance.network.receiveBufferSize=16384
canal.instance.network.sendBufferSize=16384
